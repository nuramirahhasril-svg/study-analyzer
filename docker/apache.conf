# Pengaturan Apache tambahan untuk server (Railway). Dipakai oleh Dockerfile.

ServerName localhost

# Jangan tampilkan daftar isi folder (misalnya /assets/) di browser.
<Directory /var/www/html>
    Options -Indexes
</Directory>

# Folder ini hanya dipakai PHP di server, tidak boleh dibuka lewat browser.
<DirectoryMatch "^/var/www/html/(includes|database|docker)(/|$)">
    Require all denied
</DirectoryMatch>
